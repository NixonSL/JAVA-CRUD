spring.application.name=projeto

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:projeto_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# BCrypt strength
security.bcrypt.strength=${BCRYPT_STRENGTH:10}

# Auth Service URL
auth.service.url=${AUTH_SERVICE_URL}

# OpenFeign configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=${FEIGN_LOG_LEVEL:BASIC}

# Logging
logging.level.org.example.produto.client=WARN
logging.level.org.springframework.cloud.openfeign=WARN
